name: Bootstrap project tools
description: Bootstrap only the tools required before the root Taskfile can run.

inputs:
  preinstalled:
    description: The runner image already contains Go, Node, pnpm, and Task.
    required: false
    default: "false"
  setup_go:
    description: Install the Go version declared by go.mod.
    required: false
    default: "true"
  setup_node:
    description: Install Node.js and pnpm declared by package.json.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - if: ${{ inputs.preinstalled != 'true' && inputs.setup_go == 'true' }}
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - if: ${{ inputs.preinstalled != 'true' && inputs.setup_node == 'true' }}
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - if: ${{ inputs.preinstalled != 'true' && inputs.setup_node == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Ensure pinned Task CLI
      shell: bash
      env:
        PREINSTALLED: ${{ inputs.preinstalled }}
      run: |
        set -euo pipefail

        TASK_VERSION="$(
          sed -n 's/^TASK_VERSION=//p' "$GITHUB_WORKSPACE/build/buildvars.env"
        )"

        [[ "${TASK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid TASK_VERSION in build/buildvars.env" >&2
          exit 1
        }

        if command -v task >/dev/null 2>&1; then
          INSTALLED_TASK_VERSION="$(task --version)"

          if [[ "${INSTALLED_TASK_VERSION}" == *"${TASK_VERSION}"* ]]; then
            task --version
            exit 0
          fi

          if [[ "${PREINSTALLED}" == "true" ]]; then
            echo "Preinstalled Task version is incompatible: ${INSTALLED_TASK_VERSION}" >&2
            echo "Expected Task version ${TASK_VERSION}" >&2
            exit 1
          fi
        fi

        if [[ "${PREINSTALLED}" == "true" ]]; then
          echo "The preinstalled image does not provide task" >&2
          exit 1
        fi

        command -v go >/dev/null 2>&1 || {
          echo "Go is required to bootstrap Task" >&2
          exit 1
        }

        go install "github.com/go-task/task/v3/cmd/task@v${TASK_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

