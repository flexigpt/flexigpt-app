name: Bootstrap project tools
description: Install the pinned tools needed before the root Taskfile can run.

inputs:
  setup_go:
    description: Install the Go version declared by build/buildvars.env.
    required: false
    default: "true"
  setup_node:
    description: Install the Node.js version declared by build/buildvars.env.
    required: false
    default: "true"
  setup_pnpm:
    description: Install pinned pnpm and cache its store.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        for name in GO_VERSION NODE_VERSION PNPM_VERSION TASK_VERSION; do
          version="$(sed -n "s/^${name}=//p" build/buildvars.env)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid ${name} in build/buildvars.env" >&2
            exit 1
          fi
          printf '%s=%s\n' "${name}" "${version}" >> "$GITHUB_OUTPUT"
        done

    - if: ${{ inputs.setup_go == 'true' }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.pins.outputs.GO_VERSION }}
        cache: true

    - if: ${{ inputs.setup_node == 'true' && inputs.setup_pnpm == 'true' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pins.outputs.PNPM_VERSION }}
        run_install: true

    - if: ${{ inputs.setup_node == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.pins.outputs.NODE_VERSION }}
        cache: ${{ inputs.setup_pnpm == 'true' && 'pnpm' || '' }}

    - uses: arduino/setup-task@v3
      with:
        version: ${{ steps.pins.outputs.TASK_VERSION }}
        repo-token: ${{ github.token }}
