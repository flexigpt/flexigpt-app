name: Setup Tools
description: Sets up Go, Node, pnpm, Wails
inputs: {}
runs:
  using: "composite"
  steps:
    - name: Setup GoLang
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        cache: "pnpm"

    - name: Install pnpm dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Add Go tool directory to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install Wails
      run: ${{ env.INSTALL_TOOL_WAILS }}
      shell: bash

    - name: Install Task
      run: ${{ env.INSTALL_TOOL_TASK }}
      shell: bash

    - name: Install Windows installer tooling
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
          choco install nsis --yes --no-progress
        fi
        printf '%s\n' 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
