name: Lint Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  test-lint-linux:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential
            libgtk-4-dev
            libwebkitgtk-6.0-dev
            pkg-config
          version: ubuntu26.04-gtk4-webkit6-1
      - uses: actions/cache@v6
        with:
          path: build/out/cache/golangci-lint
          key: golangci-ubuntu26.04-${{ hashFiles('build/buildvars.env', 'go.mod', 'go.sum', '.golangci*') }}-${{ github.sha }}
          restore-keys: |
            golangci-ubuntu26.04-${{ hashFiles('build/buildvars.env', 'go.mod', 'go.sum', '.golangci*') }}-
      - name: Run repository ci suite
        run: task ci
      - name: Check coverage policy
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-coverage
          path: coverage.out
          if-no-files-found: ignore

  test-macos:
    name: Native Go tests on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          setup_pnpm: "false"
      - name: Run native macOS Go tests
        run: task test-go-native

  test-windows:
    name: Native Go tests on Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          setup_pnpm: "false"
      - name: Run native Windows Go tests
        run: task test-go-native
