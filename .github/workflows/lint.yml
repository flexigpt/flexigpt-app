name: Lint

on:
  push:
    branches:
      - main
  pull_request:

    #
    # Cancel outdated runs for the same branch / PR
    #
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go - lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ".tool-versions"

      - name: Install native desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Prepare embed placeholder
        run: |
          PLACEHOLDER="frontend/dist/client/.ci-placeholder"
          mkdir -p "$(dirname "$PLACEHOLDER")"
          touch "$PLACEHOLDER"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --verbose
          version: v2.13.0
          install-mode: "goinstall"
          skip-cache: true

      - name: Remove embed placeholder
        if: ${{ always() }}
        run: rm -f frontend/dist/client/.ci-placeholder

  node:
    name: Node - knip / oxlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set-up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set-up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -F frontend run lint
