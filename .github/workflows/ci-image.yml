name: Linux CI dependency image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - Taskfile.yml
      - build/ci/linux.Dockerfile
      - build/buildvars.env
      - build/Taskfile.yml
      - go.mod
      - go.sum
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - frontend/package.json
      - .npmrc
      - .github/actions/bootstrap/action.yml
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: linux-ci-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Linux quality image
        run: task ci-image-lin

