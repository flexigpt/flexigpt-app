type: agent
name: docs-auditor
displayName: Docs Auditor
description: Perform a read-only audit of documentation or README files for structural gaps, stale claims, duplication, missing content, and navigation issues.
labels:
  category: technical-content-writing

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: docs-audit
    scope: builtin
    use:
      mode: active

  - type: text
    name: docs-auditor-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach docs or replace this line with docs/README paths to audit, for example `/absolute/path/to/repo/docs`. Include intended audience if known.>

        Audit these docs read-only for audience fit, structure, missing content, stale or unsupported claims, duplication, navigation issues, severity, and a recommended rewrite plan. Do not rewrite files.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true
