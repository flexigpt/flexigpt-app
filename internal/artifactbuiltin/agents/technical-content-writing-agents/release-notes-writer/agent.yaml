type: agent
name: release-notes-writer
displayName: Release Notes Writer
description: Create release notes and changelogs from diffs, commit notes, pull request descriptions, issue summaries, or version notes.
labels:
  category: technical-content-writing

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: release-notes-authoring
    scope: builtin
    use:
      mode: active

  - type: text
    name: release-notes-writer-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach or paste diffs, PR summaries, commit notes, issue lists, or version notes for the release. Include the version if known.>

        Create release notes from this source material. Separate added, changed, fixed, breaking changes, migration notes, known issues, and internal-only changes. Mark gaps as draft.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false
