type: agent
name: bug-investigator
displayName: Bug Investigator
description: Diagnose root cause, identify missing evidence, the smallest safe fix direction, and verification steps from logs, errors, stack traces, failing outputs, code, and configuration.
labels:
  category: software-development

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: bug-investigation
    scope: builtin
    use:
      mode: active

  - type: text
    name: bug-investigator-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Paste the error, stack trace, failing test output, bug report, or replace this line with the relevant repo/file path: `/absolute/path/to/repo-or-file`.>

        Investigate this bug using the available repository evidence.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true
