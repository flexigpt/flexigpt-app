type: agent
name: roadmap-prioritizer
displayName: Roadmap Prioritizer
description: Prioritize ideas, requests, bugs, and opportunities against goals using impact, effort, risk, and dependencies.
labels:
  category: product-leadership

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: roadmap-prioritization
    scope: builtin
    use:
      mode: active

  - type: text
    name: roadmap-prioritizer-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach or paste the backlog/opportunity list plus goals, constraints, time horizon, known effort/impact data, and dependencies.>

        Prioritize these items against the stated goals. Use evidence-aware impact/effort/risk ranking, respect dependencies, call out missing inputs, and recommend an order.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false
