type: agent
name: local-dev-workspace
displayName: Local Dev Workspace
description: Local development workspace with file read, write, unified diff, and shell command access.
labels:
  category: core

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: text
    name: local-dev-workspace-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Replace this line with the repo/project path and the task. Example: `/absolute/path/to/repo`>

        Inspect relevant files first, prefer unified diffs for edits, use whole-file writes for create/replace cases, and verify with focused shell commands when useful. Keep write and shell actions scoped.

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: applyunifieddiff
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: shellcommand
    scope: builtin
    overrides:
      autoExecute: false
