type: plugin
name: core-agents
displayName: Core Agents
description: Built-in Agents for general chat, attachment-based code implementation, local reading, and workspace editing.
labels:
  category: core

members:
  - type: agent
    name: base
    locator: ./base/agent.yaml

  - type: agent
    name: code-chat
    locator: ./code-chat/agent.yaml

  - type: agent
    name: local-dev-workspace
    locator: ./local-dev-workspace/agent.yaml

  - type: agent
    name: local-reader
    locator: ./local-reader/agent.yaml

  - type: agent
    name: local-targeted-text-editor
    locator: ./local-targeted-text-editor/agent.yaml
