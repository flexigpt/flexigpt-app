type: plugin
name: mcp-design
description: Built-in MCP server definitions for design tools.
members:
  - type: mcp
    name: canva
    parameters:
      transport: streamableHTTP
      url: https://mcp.canva.com/mcp
      displayName: Canva
      timeoutMS: 60000
      auth:
        mode: oauth
        clientCredentialsInput: CANVA_OAUTH_CLIENT
      install:
        note: >-
          Official Canva remote MCP server. Dynamic client registration is used
          when available. If Canva requires manual registration, register the
          FlexiGPT OAuth redirect URL and configure the registered client below.
        inputs:
          CANVA_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Canva OAuth Client
            description: Client ID and optional client secret for a manually registered Canva OAuth client.
            required: false
            clientSecretRequired: false
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: figma-remote
    parameters:
      transport: streamableHTTP
      url: https://mcp.figma.com/mcp
      displayName: Figma (Remote)
      auth:
        mode: oauth
      install:
        note: >-
          Official Figma remote MCP server. Only clients accepted by the Figma
          MCP Catalog can connect. Figma canvas mutations remain manually
          approved.
      policy:
        required: true
        name: builtin-manual-write-no-destructive
  - type: mcp.policy
    name: builtin-manual-write
  - type: mcp.policy
    name: builtin-manual-write-no-destructive
