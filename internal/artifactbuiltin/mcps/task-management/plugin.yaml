type: plugin
name: mcp-task-management
description: Built-in MCP servers for task management and communication.
members:
  - type: mcp
    name: atlassian
    parameters:
      transport: streamableHTTP
      url: https://mcp.atlassian.com/v1/mcp/authv2
      displayName: Atlassian Rovo (Jira + Confluence)
      auth:
        mode: oauth
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: notion
    parameters:
      transport: streamableHTTP
      url: https://mcp.notion.com/mcp
      displayName: Notion
      auth:
        mode: oauth
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: slack
    parameters:
      transport: streamableHTTP
      url: https://mcp.slack.com/mcp
      displayName: Slack
      auth:
        mode: oauth
        clientCredentialsInput: SLACK_OAUTH_CLIENT
      install:
        note: Slack MCP requires a registered confidential OAuth client.
        inputs:
          SLACK_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Slack OAuth Client
            description: Client ID and Client Secret for the Slack app.
            required: true
            clientSecretRequired: true
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp.policy
    name: builtin-manual-write
