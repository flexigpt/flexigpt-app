type: plugin
name: mcp-google
description: Google managed remote MCP servers.
members:
  - type: mcp
    name: bigquery
    parameters:
      transport: streamableHTTP
      url: https://bigquery.googleapis.com/mcp
      displayName: Google BigQuery
      timeoutMS: 60000
      auth:
        mode: oauth
        clientCredentialsInput: GOOGLE_OAUTH_CLIENT
      install:
        inputs:
          GOOGLE_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Google OAuth Client
            description: OAuth client ID and client secret from Google Auth Platform.
            required: true
            clientSecretRequired: true
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: calendar
    parameters:
      transport: streamableHTTP
      url: https://calendarmcp.googleapis.com/mcp/v1
      displayName: Google Calendar
      timeoutMS: 60000
      auth:
        mode: oauth
        clientCredentialsInput: GOOGLE_OAUTH_CLIENT
      install:
        inputs:
          GOOGLE_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Google OAuth Client
            description: OAuth client ID and client secret from Google Auth Platform.
            required: true
            clientSecretRequired: true
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: compute
    parameters:
      transport: streamableHTTP
      url: https://compute.googleapis.com/mcp
      displayName: Google Compute Engine
      timeoutMS: 60000
      auth:
        mode: oauth
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: gke
    parameters:
      transport: streamableHTTP
      url: https://container.googleapis.com/mcp
      displayName: Google Kubernetes Engine
      timeoutMS: 60000
      auth:
        mode: oauth
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: gmail
    parameters:
      transport: streamableHTTP
      url: https://gmailmcp.googleapis.com/mcp/v1
      displayName: Google Gmail
      timeoutMS: 60000
      auth:
        mode: oauth
        clientCredentialsInput: GOOGLE_OAUTH_CLIENT
      install:
        inputs:
          GOOGLE_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Google OAuth Client
            description: OAuth client ID and client secret from Google Auth Platform.
            required: true
            clientSecretRequired: true
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: maps
    parameters:
      transport: streamableHTTP
      url: https://mapstools.googleapis.com/mcp
      displayName: Google Maps
      auth:
        mode: oauth
      policy:
        required: true
        name: builtin-auto-read
  - type: mcp.policy
    name: builtin-manual-write
  - type: mcp.policy
    name: builtin-auto-read
