apiVersion: v1
type: collection
name: mcp-cloudflare
description: Cloudflare fully managed remote MCP servers.
members:
  - type: mcp
    name: agents-docs
    transport: streamable-http
    url: https://agents.cloudflare.com/mcp
    metadata:
      "flexigpt.site/mcp-runtime-v1":
        displayName: Cloudflare Agents SDK Docs
        auth: { mode: oauth }
        policy: { ref: builtin-auto-read, required: true }

  - type: mcp
    name: ai-gateway
    transport: streamable-http
    url: https://ai-gateway.mcp.cloudflare.com/mcp
