type: plugin
name: mcp-zoom
description: Official Zoom-hosted remote MCP servers.
members:
  - type: mcp
    name: zoom-docs
    parameters:
      transport: streamableHTTP
      url: https://mcp.zoom.us/mcp/docs/streamable
      displayName: Zoom Docs
      auth:
        mode: oauth
        clientCredentialsInput: ZOOM_OAUTH_CLIENT
      install:
        note:
          Zoom requires a manually registered Zoom Marketplace OAuth client and a registered FlexiGPT
          redirect URI.
        inputs:
          ZOOM_OAUTH_CLIENT:
            kind: oauthClientCredentials
            label: Zoom OAuth Client
            description: Client ID and Client Secret from a Zoom Marketplace app.
            required: true
            clientSecretRequired: true
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
