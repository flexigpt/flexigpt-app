apiVersion: v1
type: collection
name: mcp-zoom
description: Official Zoom-hosted remote MCP servers.
members:
  - type: mcp
    name: zoom-docs
    transport: streamable-http
    url: https://mcp.zoom.us/mcp/docs/streamable
    metadata:
      "flexigpt.site/mcp-runtime-v1":
        displayName: Zoom Docs
        auth:
          mode: oauth
          clientCredentialsInput: ZOOM_OAUTH_CLIENT
        install:
          note: Zoom requires a manually registered Zoom Marketplace OAuth client and a registered FlexiGPT redirect URI.
          inputs:
            ZOOM_OAUTH_CLIENT:
              kind: oauthClientCredentials
              label: Zoom OAuth Client
              description: Client ID and Client Secret from a Zoom Marketplace app.
              required: true
              clientSecretRequired: true
        policy: { ref: builtin-manual-write, required: true }

  - type: mcp
    name: meetings
