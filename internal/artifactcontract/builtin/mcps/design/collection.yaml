type: plugin
name: mcp-design
description: Built-in MCP server definitions for design tools.
members:
  - type: mcp
    name: canva
    parameters:
      transport: streamableHTTP
      url: https://mcp.canva.com/mcp
      displayName: Canva
      timeoutMS: 60000
      auth:
        mode: oauth
      install:
        note:
          Official Canva remote MCP server. Register FlexiGPT's OAuth redirect URL if the provider requires
          client registration.
      policy:
        required: true
        name: builtin-manual-write
  - type: mcp
    name: figma-remote
    parameters:
      transport: streamableHTTP
      url: https://mcp.figma.com/mcp
      displayName: Figma (Remote)
      auth:
        mode: oauth
      install:
        note: Official Figma remote MCP server. Figma canvas mutations remain manually approved.
      policy:
        required: true
        name: builtin-manual-write-no-destructive
  - type: mcp.policy
    name: builtin-manual-write
  - type: mcp.policy
    name: builtin-manual-write-no-destructive
