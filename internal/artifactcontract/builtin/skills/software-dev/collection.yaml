    locator: ./spec-driven-dev
  - type: skill
    name: codebase-exploration
    description: "Map unfamiliar repositories by identifying entry points, modules, flows, configuration, tests, and risks."
    locator: ./codebase-exploration
  - type: skill
    name: test-case-design
    description: "Design traceable happy-path, boundary, negative, and regression test cases without writing test code."
    locator: ./test-case-design
  - type: skill
    name: bug-investigation
    description: "Diagnose likely root causes from evidence and produce a verification plan without applying a fix."
    locator: ./bug-investigation
  - type: skill
    name: test-implementation
    description: "Write focused unit, integration, and regression tests using the existing project test style."
