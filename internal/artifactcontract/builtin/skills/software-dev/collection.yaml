apiVersion: v1
type: collection
name: software-dev
description: "Software Development Lifecycle Skills"
members:
  - type: skill
    name: designing-system-architecture
    description: "Design system architecture, ownership boundaries, and event-driven choices using the simplest viable option."
    locator: ./designing-system-architecture
  - type: skill
    name: refactoring-code
    description: "Plan and apply bounded behavior-preserving refactors that reduce complexity and change risk."
    locator: ./refactoring-code
  - type: skill
    name: reviewing-code
    description: "Review code, diffs, pull requests, and interfaces for concrete defects, risks, and misuse-enabling designs."
    locator: ./reviewing-code
  - type: skill
    name: spec-driven-dev
