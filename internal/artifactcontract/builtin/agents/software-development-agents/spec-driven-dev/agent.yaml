type: agent
name: spec-driven-dev
displayName: Spec Driven Development
description: Perform disciplined discovery, scoped implementation, and verification with file, text, and shell tooling.
labels:
  category: software-development

members:
  - type: text
    name: spec-driven-dev-instructions
    insert: instructions
    parameters:
      mediaType: text/markdown
      content: |-
        Start from the requested behavior and available evidence.
        Clarify constraints, identify affected code paths, implement only the necessary change, and verify with focused tests or commands.
        Keep the implementation scoped and explain assumptions.

  - type: text
    name: spec-driven-dev-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Replace this line with the repo path and feature/change request. Example: `/absolute/path/to/repo`>

        Develop this change end to end using the available repository evidence.

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: shellcommand
    scope: builtin
    overrides:
      autoExecute: false
