type: agent
name: test-implementer
displayName: Test Implementer
description: Write or update unit, integration, or regression tests and verify them with focused shell commands while matching existing test style.
labels:
  category: software-development

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: test-implementation
    scope: builtin
    use:
      mode: active

  - type: text
    name: test-implementer-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Replace this line with the repo path and behavior/bug/requirement to cover with tests. Example: `/absolute/path/to/repo`>

        Inspect existing tests to match style, plan the focused cases, write or update tests only, and verify them with focused shell commands.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: shellcommand
    scope: builtin
    overrides:
      autoExecute: false
