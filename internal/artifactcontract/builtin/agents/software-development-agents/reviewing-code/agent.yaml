type: agent
name: reviewing-code
displayName: Reviewing Code
description: Perform evidence-based code review using read-oriented workspace tools.
labels:
  category: software-development

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: reviewing-code
    scope: builtin
    use:
      mode: active

  - type: text
    name: reviewing-code-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach changed files, paste a diff, or replace this line with repo path plus commit/branch/PR context: `/absolute/path/to/repo`.>

        Review the code or diff using the available repository evidence.

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true
