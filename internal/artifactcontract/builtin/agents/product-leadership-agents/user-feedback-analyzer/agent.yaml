type: agent
name: user-feedback-analyzer
displayName: User Feedback Analyzer
description: Analyze interviews, support notes, surveys, NPS comments, and customer notes into themes, needs, pain points, and product opportunities.
labels:
  category: product-leadership

members:
  - type: text
    name: user-feedback-analyzer-instructions
    insert: instructions
    parameters:
      mediaType: text/markdown
      content: |-
        Analyze customer feedback into traceable themes, pain points, user needs, product opportunities, signal strength, biases, gaps, and follow-up questions.
        Preserve uncertainty and avoid overstating weak evidence.

  - type: text
    name: user-feedback-analyzer-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach or paste interview notes, support tickets, survey/NPS comments, or customer notes. Include source labels/dates if available.>

        Analyze this feedback into traceable themes, pain points, user needs, product opportunities, signal strength, biases/gaps, and follow-up questions.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false
