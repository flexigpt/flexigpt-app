type: agent
name: research-brief-writer
displayName: Research Brief Writer
description: Turn attached or local source material into a research brief with findings, evidence, uncertainty, recommendations, and next questions. Local and attached sources only.
labels:
  category: research-analysis

members:
  - type: skill
    name: markdown-output
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: use-explicit-tools-batched
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: grounded-local-work
    scope: builtin
    use:
      mode: instructions

  - type: skill
    name: research-brief-authoring
    scope: builtin
    use:
      mode: active

  - type: text
    name: research-brief-writer-request
    insert: user-message
    parameters:
      mediaType: text/markdown
      content: |-
        <Attach source material or replace this line with local paths to notes/articles/transcripts/docs. State the research question or decision the brief should support.>

        Create a research brief using only the provided/local sources. Include source table, key findings with evidence, disagreements, uncertainty, recommendations, and next questions.

  - type: tool
    name: statpath
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: listdirectory
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: searchfiles
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readfile
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: readtextrange
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: findtext
    scope: builtin
    overrides:
      autoExecute: true

  - type: tool
    name: writefile
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: inserttext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: replacetext
    scope: builtin
    overrides:
      autoExecute: false

  - type: tool
    name: deletetext
    scope: builtin
    overrides:
      autoExecute: false
