type: tool
name: searchfiles
displayName: Search Files
description: Searches repository files.
labels:
  category: repository
  owner: developer-tools
metadata:
  acme.example/owner: developer-tools
userCallable: false
llmCallable: true
autoExecute: false
llmToolType: function
inputSchema:
  type: object
  required:
    - query
  properties:
    query:
      type: string
userArgSchema:
  type: object
  properties:
    maxResults:
      type: integer
      minimum: 1
outputSchema:
  type: object
  properties:
    matches:
      type: array
      items:
        type: string
implementation:
  kind: go
  function: github.com/flexigpt/flexigpt/tools.SearchFiles
