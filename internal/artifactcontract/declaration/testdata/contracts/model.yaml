type: model
name: reasoning
displayName: Reasoning Model
description: General-purpose reasoning model.
labels:
  category: reasoning
  provider: anthropic

provider:
  name: anthropic

providerModelID: claude-3-7-sonnet-latest

defaults:
  stream: true
  maxPromptTokens: 200000
  maxOutputTokens: 12000
  temperature: 0.2
  systemPrompt: |
    Be precise, grounded, and concise.
  timeoutMS: 60000
  output:
    verbosity: high
    format:
      kind: text

adapterParameters:
  modelRevision: "20250219"
