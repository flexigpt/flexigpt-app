packageVersions:
  unversioned: "unversioned"

documents:
  plugins:
    - locator: "plugin.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "plugin.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "collection.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "collection.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "plugin.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - locator: "collection.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  modelProviders:
    - locator: "model-provider.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model-provider.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model-provider.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  models:
    - locator: "model.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  agents:
    - locator: "agent.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "agent.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "agent.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  tools:
    - locator: "tool.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - locator: "tool.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "tool.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"

  agentMarkdown:
    - locator: "AGENT.md"
      format: "markdown"
      decoderID: "agent-markdown"

  skillPackages:
    - locator: "SKILL.md"
      format: "markdown"
      decoderID: "agent.skill-markdown"

  mcpConfigs:
    - locator: "mcp.json"
      format: "json"
      decoderID: "artifact.mcp-json"
    - locator: ".mcp.json"
      format: "json"
      decoderID: "artifact.mcp-json"

  mcpPolicies:
    - locator: "mcp-policy.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  workspaceManifests:
    - locator: "workspace.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workspace.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workspace.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  workspaceMarkdown:
    - locator: "AGENTS.md"
      format: "markdown"
    - locator: "CLAUDE.md"
      format: "markdown"
    - locator: "README.md"
      format: "markdown"
    - locator: "llms.txt"
      format: "markdown"

  workspaceInstructions:
    - locator: "AGENTS.md"
      format: "markdown"
    - locator: "CLAUDE.md"
      format: "markdown"

documentUses:
  plugin:
    documentSets:
      - "plugins"

  canonicalYAML:
    documentSets:
      - "plugins"
      - "agents"

  canonicalJSON:
    documentSets:
      - "plugins"
      - "agents"
      - "tools"

  mcpConfig:
    documentSets:
      - "mcpConfigs"

  skillPackage:
    documentSets:
      - "skillPackages"
    defaultLocator: "SKILL.md"

  modelProviderPackage:
    documentSets:
      - "modelProviders"
    defaultLocator: "model-provider.yaml"

  modelPackage:
    documentSets:
      - "models"
    defaultLocator: "model.yaml"

  managedModelProvider:
    documentSets:
      - "modelProviders"
    defaultLocator: "model-provider.yaml"
    decoderID: "artifact-declaration-yaml"

  managedModel:
    documentSets:
      - "models"
    defaultLocator: "model.yaml"
    decoderID: "artifact-declaration-yaml"

  toolPackage:
    documentSets:
      - "tools"
    defaultLocator: "tool.yaml"

  toolPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.yaml"

  managedPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.json"

  agentManagedPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.yaml"

  managedAgent:
    documentSets:
      - "agents"
    defaultLocator: "agent.yaml"

  managedMCP:
    documentSets:
      - "mcpConfigs"
    defaultLocator: "mcp.json"
    decoderID: "artifact-declaration-json"

  managedMCPPolicy:
    documentSets:
      - "mcpPolicies"
    defaultLocator: "mcp-policy.json"

  agentMarkdown:
    documentSets:
      - "agentMarkdown"

  workspaceMarkdown:
    documentSets:
      - "workspaceMarkdown"

  workspaceInstructions:
    documentSets:
      - "workspaceInstructions"

markdownRules:
  agent:
    documentUses:
      - "agentMarkdown"
    basenameSuffixes:
      - ".agent.md"

  text:
    documentUses:
      - "workspaceMarkdown"
    extensions:
      - ".md"
    excludeDocumentUses:
      - "skillPackage"
    excludeRules:
      - "agent"

  defaultText:
    documentUses:
      - "workspaceMarkdown"

  instructionText:
    documentUses:
      - "workspaceInstructions"

discovery:
  skill:
    root: "."
    recursive: true
    authoritative: true
    includePatterns: []
    documentSets:
      - "skillPackages"
    decoderHints:
      - locator: "."
        recursive: true
        decoderIDs:
          - "agent.skill-markdown"
    allowedDecoderIDs:
      - "agent.skill-markdown"

  mcp:
    root: "."
    recursive: true
    authoritative: true
    includePatterns:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
    documentSets:
      - "plugins"
      - "mcpConfigs"
      - "mcpPolicies"

  workspace:
    root: "."
    recursive: true
    authoritative: true
    includePatterns:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.agent.md"
      - "**/docs/**/*.md"
    documentSets:
      - "plugins"
      - "mcpConfigs"
      - "agents"
      - "skillPackages"
      - "agentMarkdown"
      - "workspaceManifests"
      - "workspaceMarkdown"
      - "workspaceInstructions"
    decoderHints:
      - locator: "."
        recursive: true
        decoderIDs:
          - "text-markdown"

  selector:
    root: "."
    recursive: true
    authoritative: true
    includePatterns:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
    documentSets:
      - "plugins"
      - "mcpConfigs"
      - "agents"
      - "skillPackages"

discoveryUses:
  skill:
    profiles:
      - "skill"

  mcp:
    profiles:
      - "mcp"

  workspace:
    profiles:
      - "workspace"

  selector:
    profiles:
      - "selector"
