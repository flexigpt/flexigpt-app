packageVersions:
  unversioned: "unversioned"

documents:
  plugins:
    - locator: "plugin.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "plugin.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.plugin.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "plugin.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.plugin.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.plugin.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  modelProviders:
    - locator: "model-provider.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model-provider.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.model-provider.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model-provider.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.model-provider.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.model-provider.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  models:
    - locator: "model.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "model.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.model.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.model.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.model.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  agents:
    - locator: "agent.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "agent.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "agent.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.agent.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.agent.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.agent.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  tools:
    - locator: "tool.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - locator: "tool.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "tool.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.tool.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.tool.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.tool.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  teams:
    - locator: "team.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "team.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "team.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.team.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.team.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.team.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  loops:
    - locator: "loop.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "loop.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "loop.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.loop.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.loop.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.loop.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  workflows:
    - locator: "workflow.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workflow.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workflow.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.workflow.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.workflow.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.workflow.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  agentMarkdown:
    - locator: "AGENT.md"
      format: "markdown"
      decoderID: "agent-markdown"
    - pattern: "*.agent.md"
      format: "markdown"
      decoderID: "agent-markdown"

  skillPackages:
    - locator: "SKILL.md"
      format: "markdown"
      decoderID: "agent.skill-markdown"

  mcpConfigs:
    - locator: "mcp.json"
      format: "json"
      decoderID: "artifact.mcp-json"
    - locator: ".mcp.json"
      format: "json"
      decoderID: "artifact.mcp-json"
    - pattern: "*.mcp.json"
      format: "json"
      decoderID: "artifact.mcp-json"

  mcpPolicies:
    - locator: "mcp-policy.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - locator: "mcp-policy.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "mcp-policy.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.mcp-policy.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.mcp-policy.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.mcp-policy.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"

  workspaceManifests:
    - locator: "workspace.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workspace.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - locator: "workspace.json"
      format: "json"
      decoderID: "artifact-declaration-json"
    - pattern: "*.workspace.yml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.workspace.yaml"
      format: "yaml"
      decoderID: "artifact-declaration-yaml"
    - pattern: "*.workspace.json"
      format: "json"
      decoderID: "artifact-declaration-json"

  workspaceMarkdown:
    - locator: "AGENTS.md"
      format: "markdown"
      decoderID: "text-markdown"
    - locator: "CLAUDE.md"
      format: "markdown"
      decoderID: "text-markdown"
    - locator: "README.md"
      format: "markdown"
      decoderID: "text-markdown"
    - locator: "llms.txt"
      format: "markdown"
      decoderID: "text-markdown"

  workspaceInstructions:
    - locator: "AGENTS.md"
      format: "markdown"
      decoderID: "text-markdown"
    - locator: "CLAUDE.md"
      format: "markdown"
      decoderID: "text-markdown"

documentUses:
  plugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.yaml"
    decoderID: "artifact-declaration-yaml"

  canonicalYAML:
    documentSets:
      - "plugins"
      - "agents"

  canonicalJSON:
    documentSets:
      - "plugins"
      - "agents"
      - "tools"

  mcpConfig:
    documentSets:
      - "mcpConfigs"

  skillPackage:
    documentSets:
      - "skillPackages"
    defaultLocator: "SKILL.md"

  modelProviderPackage:
    documentSets:
      - "modelProviders"
    defaultLocator: "model-provider.yaml"

  modelPackage:
    documentSets:
      - "models"
    defaultLocator: "model.yaml"

  managedModelProvider:
    documentSets:
      - "modelProviders"
    defaultLocator: "model-provider.yaml"
    decoderID: "artifact-declaration-yaml"

  managedModel:
    documentSets:
      - "models"
    defaultLocator: "model.yaml"
    decoderID: "artifact-declaration-yaml"

  toolPackage:
    documentSets:
      - "tools"
    defaultLocator: "tool.yaml"

  toolPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.yaml"

  teamPackage:
    documentSets:
      - "teams"
    defaultLocator: "team.yaml"
    decoderID: "artifact-declaration-yaml"

  loopPackage:
    documentSets:
      - "loops"
    defaultLocator: "loop.yaml"
    decoderID: "artifact-declaration-yaml"

  workflowPackage:
    documentSets:
      - "workflows"
    defaultLocator: "workflow.yaml"
    decoderID: "artifact-declaration-yaml"

  managedPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.json"

  agentManagedPlugin:
    documentSets:
      - "plugins"
    defaultLocator: "plugin.yaml"

  managedAgent:
    documentSets:
      - "agents"
    defaultLocator: "agent.yaml"

  managedMCP:
    documentSets:
      - "mcpConfigs"
    defaultLocator: "mcp.json"
    decoderID: "artifact-declaration-json"

  managedMCPPolicy:
    documentSets:
      - "mcpPolicies"
    defaultLocator: "mcp-policy.json"

  agentMarkdown:
    documentSets:
      - "agentMarkdown"

  workspaceMarkdown:
    documentSets:
      - "workspaceMarkdown"

  workspaceInstructions:
    documentSets:
      - "workspaceInstructions"

  workspaceManifest:
    documentSets:
      - "workspaceManifests"

markdownRules:
  agent:
    documentUses:
      - "agentMarkdown"
    basenameSuffixes:
      - ".agent.md"

  text:
    documentUses:
      - "workspaceMarkdown"
    excludeDocumentUses:
      - "skillPackage"
    excludeRules:
      - "agent"

  defaultText:
    documentUses:
      - "workspaceMarkdown"

  instructionText:
    documentUses:
      - "workspaceInstructions"

discovery:
  skill:
    root: "."
    recursive: true
    authoritative: true
    includePatterns: []
    excludePatterns:
      - ".git/**"
      - "**/.git/**"
      - ".hg/**"
      - "**/.hg/**"
      - ".svn/**"
      - "**/.svn/**"
      - "node_modules/**"
      - "**/node_modules/**"
      - "vendor/**"
      - "**/vendor/**"
      - ".venv/**"
      - "**/.venv/**"
    documentSets:
      - "skillPackages"
    decoderHints:
      - locator: "."
        recursive: true
        decoderIDs:
          - "agent.skill-markdown"
    allowedDecoderIDs:
      - "agent.skill-markdown"

  mcp:
    root: "."
    recursive: true
    authoritative: true
    includePatterns: []
    excludePatterns:
      - ".git/**"
      - "**/.git/**"
      - ".hg/**"
      - "**/.hg/**"
      - ".svn/**"
      - "**/.svn/**"
      - "node_modules/**"
      - "**/node_modules/**"
      - "vendor/**"
      - "**/vendor/**"
      - ".venv/**"
      - "**/.venv/**"
    documentSets:
      - "plugins"
      - "mcpConfigs"
      - "mcpPolicies"
    allowedDecoderIDs:
      - "artifact-declaration-json"
      - "artifact-declaration-yaml"
      - "artifact.mcp-json"

  workspace:
    root: "."
    recursive: true
    authoritative: true
    includePatterns: []
    excludePatterns:
      - ".git/**"
      - "**/.git/**"
      - ".hg/**"
      - "**/.hg/**"
      - ".svn/**"
      - "**/.svn/**"
      - "node_modules/**"
      - "**/node_modules/**"
      - "vendor/**"
      - "**/vendor/**"
      - ".venv/**"
      - "**/.venv/**"
    documentSets:
      - "workspaceManifests"
    decoderHints:
      - locator: "."
        recursive: true
        decoderIDs:
          - "agent.skill-markdown"
          - "agent-markdown"
    allowedDecoderIDs:
      - "artifact-declaration-json"
      - "artifact-declaration-yaml"
      - "artifact.mcp-json"
      - "agent.skill-markdown"
      - "agent-markdown"

discoveryUses:
  skill:
    profiles:
      - "skill"

  mcp:
    profiles:
      - "mcp"

  workspace:
    profiles:
      - "workspace"

workspaceDiscovery:
  bootstrapDiscoveryUse: "workspace"
  selectorTypes:
    skill:
      documentUses:
        - "skillPackage"
    agent:
      documentUses:
        - "managedAgent"
        - "agentMarkdown"
    plugin:
      documentUses:
        - "plugin"
    mcp:
      documentUses:
        - "mcpConfig"
    "mcp.policy":
      documentUses:
        - "managedMCPPolicy"
    model:
      documentUses:
        - "modelPackage"
        - "modelProviderPackage"
    team:
      documentUses:
        - "teamPackage"
    loop:
      documentUses:
        - "loopPackage"
    workflow:
      documentUses:
        - "workflowPackage"
