application:
  storage:
    dataDirectory: "flexigpt"
    settingsDirectory: "settings_v2"
    conversationsDirectory: "conversations_v2"
    artifactStoreDirectory: "artifacts_v2"

  userRoot:
    id: "0192c4c0-0000-7000-8000-000000000002"
    storageKey: "user-artifacts"
    displayName: "User Artifacts"
    description: "Retained mutable application Artifact namespace."
    protected: false
    retained: true

builtin:
  root:
    id: "0192c4c0-0000-7000-8000-000000000001"
    storageKey: "builtins"
    displayName: "Application Built-ins"
    description: "Protected application-provided artifact source namespace."
    protected: true
    retained: false

  sources:
    - name: "artifacts"
      roles:
        - "packages"
      id: "0192c4c0-0001-7000-8000-000000000001"
      storageKey: "artifacts"
      kind: "managed-directory"
      displayName: "Application Built-in Artifact Source"
      enabled: true
      config: {}
      discovery:
        root: "."
        recursive: true
        authoritative: true
        includePatterns: []
        documentSets:
          - "plugins"
          - "mcpConfigs"
          - "modelProviders"
          - "models"
          - "mcpPolicies"
          - "agents"
          - "skillPackages"
          - "tools"

  embeddedPackages:
    skills: "skills"
    agents: "agents"
    mcps: "mcps"
    tools: "tools"
