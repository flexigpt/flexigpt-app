apiVersion: v1
type: workflow
name: change-workflow
displayName: Change Workflow
description: Plans, implements, and reviews a repository change.
labels:
  category: engineering
  owner: platform
metadata:
  acme.example/owner: platform

inputSchema:
  type: object
  required: [request]
  properties:
    request:
      type: string
  additionalProperties: false

outputSchema:
  type: object
  required: [patch, validation]
  properties:
    patch:
      type: string
    validation: true
  additionalProperties: false

targets:
  planner:
    kind: agent
    ref: planner
    locator: ./agents/planner.agent.yaml
  implementer:
    kind: agent
    ref: implementer
    locator: ./agents/implementer.agent.yaml
  reviewer:
    kind: agent
    ref: reviewer
    locator: ./agents/reviewer.agent.yaml
  validate-change:
    kind: tool
    ref: validate-change

steps:
  - id: plan
    call:
      target: planner
      input:
        request:
          $expr: input.request

  - id: refine
    repeat:
      state:
        schema:
          type: object
          required: [approved, patch, feedback]
          properties:
            approved:
              type: boolean
            patch:
              type: string
            feedback:
              type: string
          additionalProperties: false
        initial:
          approved: false
          patch: ""
          feedback: ""
      until:
        $expr: state.approved
      maxIterations: 3
      onExhausted: fail
      do:
        steps:
          - id: implement
            call:
              target: implementer
              input:
                plan:
                  $expr: steps.plan.output
                feedback:
                  $expr: state.feedback

          - id: review
            call:
              target: reviewer
              input:
                patch:
                  $expr: steps.implement.output.patch

          - id: record
            set:
              values:
                approved:
                  $expr: steps.review.output.approved
                patch:
                  $expr: steps.implement.output.patch
                feedback:
                  $expr: steps.review.output.feedback

  - id: final-check
    call:
      target: validate-change
      input:
        patch:
          $expr: steps.refine.output.state.patch

output:
  patch:
    $expr: steps.refine.output.state.patch
  validation:
    $expr: "steps['final-check'].output"
