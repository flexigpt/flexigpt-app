# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv:
  - "build/buildvars.env"

env:
  VERSION_TAG: '{{.VERSION_TAG | default ""}}'
  FLEXIGPT_EXTRA_TAGS: '{{.EXTRA_TAGS | default .FLEXIGPT_EXTRA_TAGS | default ""}}'

includes:
  desktop:
    taskfile: ./build/Taskfile.yml
    dir: "{{.ROOT_DIR}}"

  git:
    taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/git.yml
    checksum: b22093001cd4d15f3ccf39ba4ccf16e509468379ac24d25f79196f277a7f02b0
    flatten: true

  go:
    taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml
    checksum: 4f3a7e4d867c78ddd8ab2aa72e2edd27b345323013ee1e5b5d9604f1de237240
    dir: "{{.ROOT_DIR}}"
    internal: true
    vars:
      GREETING: Hello, these are FlexiGPT tasks!
      GO_MODULE_PATH: "{{.COMMON_PRODUCT_GITPATH}}"
      DEPGRAPH_ENTRY_POINT: "{{.GO_MAIN_ENTRYPOINT}}"
      DEPGRAPH_ONLYPREFIXES: "{{.COMMON_PRODUCT_GITPATH}},command-line-arguments"

tasks:
  default:
    desc: Run the default Go task suite and print all configured variables.
    cmds:
      - task: go:default
      - task: go:print-all-vars
    silent: true

  licensesgo:
    desc: Generate the Go dependency license report.
    cmds:
      - go-licenses report ./... --template "{{.LICENSE_TEMPLATE_PATH}}" --ignore "{{.COMMON_PRODUCT_GITPATH}}" > "{{.LICENSE_GO_FILENAME}}"

  cloc:
    desc: Count lines of code in the repository using configured exclusions.
    cmds:
      - |
        cloc \
          --vcs=git --ignored=ignored.txt --exclude_ext=yaml,sum,mod,md5 \
          --force-lang=Mustache,tmpl --force-lang=INI,env --force-lang=INI,dev --force-lang=INI,prod \
          --not-match-f='LICENSE$|\.npmrc$|\.prettierignore$|\.gitignore$|\.gitattributes$|\.gitmodules$' \
          .

  cloc-multi:
    desc: Run the GitHub Actions CLOC reporting workflow locally with act.
    cmds:
      - gh act workflow_dispatch -W "./.github/workflows/cloc-report.yml" --artifact-server-path "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}"

  godepgraph:
    desc: Generate the Go dependency graph.
    cmds:
      - task: go:depgraph

  check-version:
    desc: Validate that VERSION_TAG matches the project release version format.
    cmds:
      - >-
        node -e "const tag=process.env.VERSION_TAG;if(!/^v\d+\.\d+\.\d+$/.test(tag||'')){console.error('VERSION_TAG must match vX.Y.Z',tag);process.exit(1);}"

  licenses:gen:
    desc: Generate project, Go, and frontend dependency license files.
    cmds:
      - bash ./build/licenses/gen_licenses.sh --version "$VERSION_TAG"

  upgrade-do:
    desc: Upgrade JavaScript and Go dependencies.
    cmds:
      - pnpm up -r
      - task: go:upgrade-do

  upgrade-check:
    desc: Check for outdated JavaScript and Go dependencies.
    cmds:
      - task: go:upgrade-check
      - pnpm outdated -r || true

  upgrade-pnpm:
    desc: Activate and configure the required pnpm version through Corepack.
    cmds:
      - corepack enable
      - asdf reshim nodejs
      - corepack prepare pnpm@12.14.0 --activate
      - corepack use pnpm@12.14.0
      - asdf reshim nodejs

  upgrade-nodejs:
    desc: Install and activate the required Node.js version, then update pnpm.
    cmds:
      - asdf install nodejs v24.14.0
      - asdf set nodejs v24.14.0
      - task: upgrade-pnpm
      - cmd: echo '***Search and update builds***'
        silent: true

  install-go-tools:
    desc: Install Wails, Go license tooling, and the configured Go development tools.
    cmds:
      - "{{.INSTALL_TOOL_WAILS}}"
      - "{{.INSTALL_TOOL_TASK}}"
      - "{{.INSTALL_TOOL_GO_LICENSES}}"
      - task: go:install-tools
      - cmd: echo '***If updating wails or licences-go or golangci-lint, search for their previous versions and then update all places.***'
        silent: true

  upgrade-go:
    desc: Install and activate the configured Go version and reinstall Go tools.
    vars:
      GO_VERSION: 1.27.0
    cmds:
      - asdf install golang {{.GO_VERSION}}
      - asdf set golang {{.GO_VERSION}}
      - go version

      - cmd: |
          GO_ASDF_DIR="$(asdf where golang {{.GO_VERSION}})"
          export GOPATH="$GO_ASDF_DIR/packages"
          export GOBIN="$GOPATH/bin"
          export PATH="$ASDF_DATA_DIR/shims:$GOBIN:$PATH"
          echo "Installing Go tools into $GOBIN, Path: $PATH"
          task install-go-tools
          golangci-lint version
        silent: true

      - asdf reshim golang {{.GO_VERSION}}

      - cmd: |
          echo 'Search for {{.GO_VERSION}}. Update builds, flatpak yml has a ref and needs a sha and dl link. See if go mod file needs update.'
          echo 'See if your Path is properly set via zshrc or bashrc and reflected vscode.'
        silent: true

  build-linux:
    desc: Build the Linux production application package.
    deps:
      - check-version
    cmds:
      - task: build
        vars:
          PLATFORM: linux
          ARCH: amd64
          CONFIG: production

  build-mac:
    desc: Build the macOS production application package.
    deps:
      - check-version
    cmds:
      - task: build
        vars:
          PLATFORM: darwin
          ARCH: universal
          CONFIG: production

  build-win:
    desc: Build the Windows production application package.
    deps:
      - check-version
    cmds:
      - task: licenses:gen
      - task: build-win-binary
      - task: package-win-installer

  build-win-binary:
    desc: Build the Windows production executable without packaging or signing.
    deps:
      - check-version
    cmds:
      - task: build
        vars:
          PLATFORM: windows
          ARCH: amd64
          CONFIG: production

  package-win-installer:
    desc: Package the existing Windows executable and license files with custom NSIS.
    deps:
      - check-version
    cmds:
      - task: desktop:installer

  package-mac:
    desc: Run the existing macOS build, signing, and notarization pipeline.
    deps:
      - check-version
    cmds:
      - bash ./build/darwin/build_sign_notarize.sh --version "$VERSION_TAG" {{.CLI_ARGS}}

  package-win:
    desc: Run the existing Windows build, signing, and NSIS packaging pipeline.
    deps:
      - check-version
    cmds:
      - bash ./build/windows/build_sign_package.sh --version "$VERSION_TAG" {{.CLI_ARGS}}

  package-flatpak:
    desc: Build and install the application inside Flatpak Builder.
    preconditions:
      - sh: test -n "${FLATPAK_DEST:-}"
        msg: "package-flatpak requires the Flatpak Builder environment"
    cmds:
      - bash ./build/flatpak/build_flatpak.sh

  bindings:
    desc: Generate Wails v3 TypeScript service bindings.
    cmds:
      - task: desktop:bindings

  dev:
    desc: Run Wails v3 development mode through the project watcher configuration.
    env:
      WAILS_VITE_PORT: '{{.WAILS_VITE_PORT | default "5173"}}'
      FLEXIGPT_EXTRA_TAGS: '{{.EXTRA_TAGS | default .FLEXIGPT_EXTRA_TAGS | default ""}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port "{{.WAILS_VITE_PORT | default "5173"}}"

  build:
    desc: Build the desktop application through the project Wails v3 tasks.
    cmds:
      - task: desktop:build

  build-withbindings:
    desc: Build a complete debug desktop application, generate bindings, and capture output.
    env:
      VERSION_TAG: "{{.COMMON_APP_DEV_VERSION}}"
      FLEXIGPT_DEV_SERVER: "0"
    cmds:
      - node -e "require('node:fs').mkdirSync(process.argv[1],{recursive:true})" "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}"
      - >-
        node "{{.ROOT_DIR}}/build/desktop.mjs" build
        "{{.PLATFORM | default OS}}"
        "{{.ARCH | default ARCH}}"
        debug
        "{{.EXTRA_TAGS | default .FLEXIGPT_EXTRA_TAGS | default ""}}"
        > "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}/log.txt" 2>&1

  ghact-flatpak:
    desc: Run the Flatpak packaging workflow locally with act.
    cmds:
      - gh act -v workflow_dispatch -W "./.github/workflows/flatpak.yml" --artifact-server-path "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}" --input tag="{{.COMMON_APP_DEV_VERSION}}"

  ghact-nsis:
    desc: Run the NSIS Windows installer packaging workflow locally with act.
    cmds:
      - gh act workflow_dispatch -W "./.github/workflows/nsispak.yml" --artifact-server-path "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}" --input tag="{{.COMMON_APP_DEV_VERSION}}"

  ghact-macpkg:
    desc: Run the macOS package workflow locally with act.
    cmds:
      - gh act workflow_dispatch -W "./.github/workflows/macpkg.yml" --artifact-server-path "{{.ROOT_DIR}}/{{.COMMON_APP_DEV_ARTIFACT_DIR}}" --input tag="{{.COMMON_APP_DEV_VERSION}}"

  run-dev:
    desc: Start the Wails application in development mode.
    cmds:
      - task: dev
        vars:
          VERSION_TAG: "{{.COMMON_APP_DEV_VERSION}}"

  lint-gopls:
    desc: Run Go linting through gopls.
    cmds:
      - task: go:lint-gopls

  lint-go-fix-specific:
    desc: Apply automatic fixes for the configured specific Go linter.
    cmds:
      - task: go:lint-fix-specific
        vars:
          SPECIFIC_LINTER: "godot"

  lint-go-sort:
    desc: Sort Go imports and apply Go lint sorting fixes.
    cmds:
      - pnpm run touch:tmp
      - task: go:lint-sort

  lint-go-fix:
    desc: Apply automatic fixes for Go lint issues.
    cmds:
      - task: go:lint-fix

  lint-go:
    desc: Run Go lint checks.
    cmds:
      - pnpm run touch:tmp
      - task: go:lint

  lint:
    desc: Run Go and frontend lint checks.
    cmds:
      - task: lint-go
      - pnpm -F frontend run lint

  fmt-go:
    desc: Format Go source files.
    cmds:
      - task: go:fmt

  fmt:
    desc: Fix formatting errors.
    cmds:
      - pnpm -F frontend run fmt:fix
      - task: go:fmt

  test-go:
    desc: Run Go tests and generate coverage output.
    cmds:
      - pnpm run touch:tmp
      - task: go:coverage

  test-all-go:
    desc: Run all Go tests, including generated catalog consistency tests.
    cmds:
      - pnpm run touch:tmp
      - task: go:coverage
        vars:
          GO_TEST_TAGS: "integration generated_catalog"

  test:
    desc: Run Go and frontend test suites.
    cmds:
      - task: test-go
      - pnpm -F frontend run test

  lt-go:
    desc: Run Go linting and tests.
    cmds:
      - task: lint-go
      - task: test-go

  lt:
    desc: Run all linting and test suites.
    cmds:
      - task: lint
      - task: test
