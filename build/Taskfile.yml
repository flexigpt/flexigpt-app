# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The platform MJS files validate all values before using them.
env:
  VERSION_TAG: '{{.VERSION_TAG | default ""}}'
  SIGN: '{{.SIGN | default "false"}}'
  NOTARIZE: '{{.NOTARIZE | default "false"}}'
  FLEXIGPT_EXTRA_TAGS: '{{.EXTRA_TAGS | default .FLEXIGPT_EXTRA_TAGS | default ""}}'
  WAILS_VITE_PORT: '{{.WAILS_VITE_PORT | default "5173"}}'

tasks:
  check-version:
    internal: true
    cmds:
      - node build/support.mjs validate-version

  embed-prepare:
    internal: true
    cmds:
      - node build/support.mjs embed-prepare

  embed-clean:
    internal: true
    cmds:
      - node build/support.mjs embed-clean

  build-lin:
    cmds:
      - node build/lin.mjs build

  build-linux:
    internal: true
    cmds:
      - task: build-lin

  build-mac:
    cmds:
      - node build/mac.mjs build

  build-darwin:
    internal: true
    cmds:
      - task: build-mac

  build-win:
    cmds:
      - node build/win.mjs build

  build-windows:
    internal: true
    cmds:
      - task: build-win

  build-dev-lin:
    cmds:
      - node build/lin.mjs build-dev

  build-dev-linux:
    internal: true
    cmds:
      - task: build-dev-lin

  build-dev-mac:
    cmds:
      - node build/mac.mjs build-dev

  build-dev-darwin:
    internal: true
    cmds:
      - task: build-dev-mac

  build-dev-win:
    cmds:
      - node build/win.mjs build-dev

  build-dev-windows:
    internal: true
    cmds:
      - task: build-dev-win

  package-lin:
    cmds:
      - node build/lin.mjs package

  package-mac:
    cmds:
      - node build/mac.mjs package

  package-win:
    cmds:
      - node build/win.mjs package

  flatpak-install:
    desc: Install the application into the active Flatpak Builder destination.
    cmds:
      - node build/lin.mjs flatpak-install

  sign-lin:
    env:
      SIGN: "true"
    cmds:
      - node build/lin.mjs package

  sign-mac:
    env:
      SIGN: "true"
    cmds:
      - node build/mac.mjs package

  sign-win:
    env:
      SIGN: "true"
    cmds:
      - node build/win.mjs package

  run-dev-lin:
    cmds:
      - node build/lin.mjs dev

  run-dev-mac:
    cmds:
      - node build/mac.mjs dev

  run-dev-win:
    cmds:
      - node build/win.mjs dev

  bindings-lin:
    cmds:
      - node build/lin.mjs bindings

  bindings-linux:
    internal: true
    cmds:
      - task: bindings-lin

  bindings-mac:
    cmds:
      - node build/mac.mjs bindings

  bindings-darwin:
    internal: true
    cmds:
      - task: bindings-mac

  bindings-win:
    cmds:
      - node build/win.mjs bindings

  bindings-windows:
    internal: true
    cmds:
      - task: bindings-win

  licenses-lin:
    cmds:
      - node build/lin.mjs licenses

  licenses-linux:
    internal: true
    cmds:
      - task: licenses-lin

  licenses-mac:
    cmds:
      - node build/mac.mjs licenses

  licenses-darwin:
    internal: true
    cmds:
      - task: licenses-mac

  licenses-win:
    cmds:
      - node build/win.mjs licenses

  licenses-windows:
    internal: true
    cmds:
      - task: licenses-win

  setup-lin:
    cmds:
      - node build/lin.mjs setup

  setup-win:
    cmds:
      - node build/win.mjs setup

  ci-image-lin:
    cmds:
      - node build/lin.mjs ci-image-lin
