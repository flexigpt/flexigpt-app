id: io.github.flexigpt.client
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: FlexiGPT

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --env=GTK_CSD=1
  - --unset-env=LD_PRELOAD
  - --talk-name=org.freedesktop.secrets
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.Flatpak

build-options:
  build-args:
    - --share=network
  append-path: /app/sdk/golang/bin:/app/sdk/node/bin:/app/go/bin
  env:
    GOROOT: /app/sdk/golang
    GOBIN: /app/go/bin
    CGO_ENABLED: "1"
    NODEROOT: /app/sdk/node
    FLEXIGPT_TOOLS_DIR: /app/go/bin
    XDG_CONFIG_HOME: /app/xdgdirs/config
    XDG_DATA_HOME: /app/xdgdirs/data
    VERSION_TAG: __FLEXIGPT_VERSION_TAG__
    SOURCE_DATE_EPOCH: __FLEXIGPT_SOURCE_DATE_EPOCH__

cleanup:
  - /sdk
  - /go
  - /xdgdirs

modules:
  - name: golang
    buildsystem: simple
    build-commands:
      - mkdir -p "$GOROOT"
      - cp -a . "$GOROOT"
    sources:
      - type: archive
        url: https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
        sha256: 675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685

  - name: nodejs
    buildsystem: simple
    build-commands:
      - mkdir -p "$NODEROOT"
      - cp -a . "$NODEROOT"
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.xz
        sha256: 41cd79bb7877c81605a9e68ec4c91547774f46a40c67a17e34d7179ef11729df

  - name: pnpm
    buildsystem: simple
    build-commands:
      - npm install --global pnpm@12.14.0

  - name: wails
    buildsystem: simple
    build-commands:
      - GOBIN=/app/go/bin /app/sdk/golang/bin/go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

  - name: go-licenses
    buildsystem: simple
    build-commands:
      - GOBIN=/app/go/bin /app/sdk/golang/bin/go install github.com/google/go-licenses/v2@v2.0.1

  - name: FlexiGPT
    buildsystem: simple
    build-commands:
      - node build/lin.mjs flatpak-install
    sources:
      - type: dir
        path: __FLEXIGPT_SOURCE_DIR__
        skip:
          - .git
          - .flatpak-builder
          - .task
          - node_modules
          - frontend/node_modules
          - frontend/dist
          - build/bin
          - build/out
