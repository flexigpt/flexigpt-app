id: io.github.flexigpt.client
runtime: org.gnome.Platform
runtime-version: "__FLEXIGPT_FLATPAK_RUNTIME_VERSION__"
sdk: org.gnome.Sdk

command: FlexiGPT

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --env=GTK_CSD=1
  - --unset-env=LD_PRELOAD
  - --talk-name=org.freedesktop.secrets
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.Flatpak

build-options:
  build-args:
    - --share=network
  append-path: /app/sdk/golang/bin:/app/sdk/node/bin:/app/go/bin
  env:
    GOROOT: /app/sdk/golang
    GOBIN: /app/go/bin
    FLEXIGPT_GO_EXECUTABLE: /app/sdk/golang/bin/go
    CGO_ENABLED: "1"
    NODEROOT: /app/sdk/node
    FLEXIGPT_TOOLS_DIR: /app/go/bin
    XDG_CONFIG_HOME: /app/xdgdirs/config
    XDG_DATA_HOME: /app/xdgdirs/data
    VERSION_TAG: __FLEXIGPT_VERSION_TAG__
    SOURCE_DATE_EPOCH: __FLEXIGPT_SOURCE_DATE_EPOCH__

cleanup:
  - /sdk
  - /go
  - /xdgdirs

modules:
  - name: golang
    buildsystem: simple
    build-commands:
      - mkdir -p "$GOROOT"
      - cp -a . "$GOROOT"
      - test -x "$GOROOT/bin/go"

    sources:
      - type: archive
        url: https://go.dev/dl/go__FLEXIGPT_GO_VERSION__.linux-amd64.tar.gz
        sha256: __FLEXIGPT_GO_LINUX_AMD64_SHA256__
        strip-components: 1

  - name: nodejs
    buildsystem: simple
    build-commands:
      - mkdir -p "$NODEROOT"
      - cp -a . "$NODEROOT"
      - test -x "$NODEROOT/bin/node"

    sources:
      - type: archive
        url: https://nodejs.org/dist/v__FLEXIGPT_NODE_VERSION__/node-v__FLEXIGPT_NODE_VERSION__-linux-x64.tar.xz
        sha256: __FLEXIGPT_NODE_LINUX_X64_SHA256__
        strip-components: 1

  - name: pnpm
    buildsystem: simple
    build-commands:
      - npm install --global pnpm@__FLEXIGPT_PNPM_VERSION__

  - name: wails
    buildsystem: simple
    build-commands:
      - GOBIN=/app/go/bin /app/sdk/golang/bin/go install github.com/wailsapp/wails/v3/cmd/wails3@__FLEXIGPT_WAILS_VERSION__

  - name: go-licenses
    buildsystem: simple
    build-commands:
      - GOBIN=/app/go/bin /app/sdk/golang/bin/go install github.com/google/go-licenses/v2@__FLEXIGPT_GO_LICENSES_VERSION__

  - name: FlexiGPT
    buildsystem: simple
    build-commands:
      - |
        export GOROOT="/app/sdk/golang"
        export NODEROOT="/app/sdk/node"
        export GOBIN="/app/go/bin"
        export FLEXIGPT_GO_EXECUTABLE="/app/sdk/golang/bin/go"
        export PATH="/app/sdk/golang/bin:/app/sdk/node/bin:/app/go/bin:${PATH}"
        test -x "${FLEXIGPT_GO_EXECUTABLE}"
        "${FLEXIGPT_GO_EXECUTABLE}" version
        test -x "/app/sdk/node/bin/node"
        /app/sdk/node/bin/node --version
        /app/sdk/node/bin/node build/flatpak/builder.mjs flatpak-install
    sources:
      - type: dir
        path: __FLEXIGPT_SOURCE_DIR__
        skip:
          - .git
          - .flatpak-builder
          - .task
          - node_modules
          - frontend/node_modules
          - frontend/dist
          - bin
          - build/bin
          - build/out
