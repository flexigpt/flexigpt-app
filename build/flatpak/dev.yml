version: "3"

dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir:
      - .git
      - .task
      - node_modules
      - frontend/dist
      - build
    file:
      - .DS_Store
    watched_extension:
      - "*.go"
      - go.mod
      - go.sum
    git_ignore: true
  executes:
    - cmd: node build/flatpak/builder.mjs frontend
      type: background
    - cmd: node build/flatpak/builder.mjs dev-build
      type: blocking
    - cmd: node build/flatpak/builder.mjs dev-run
      type: primary
